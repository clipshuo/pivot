[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivot"
version = "0.1.0"
description = "Assemblage d'images en panorama sphérique 360° équirectangulaire"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
pivot = "pivot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
